# Render blueprint for the Aliran RESELLER panel.
#
# Why only the reseller runs on Render: the panel, broadcaster, repeater, library
# and EPG all speak Hyperswarm over UDP and need hole-punching + a persistent
# identity on a stable host. A managed PaaS terminates that traffic and gives no
# inbound UDP, so those services belong on a VPS/own hardware (see deploy/ and
# SOMALISTREAM.md). The reseller is a plain HTTP dashboard that only makes
# OUTBOUND calls to the panel admin API, so it runs happily on Render.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo. Render reads this
# file and prompts for the sync:false secrets below. This is the same service that is
# already live at https://aliran-reseller.onrender.com (created via the Render API;
# the blueprint is the reproducible declaration of it).
services:
  - type: web
    name: aliran-reseller
    runtime: docker
    dockerfilePath: ./reseller/Dockerfile
    dockerContext: .
    plan: free
    region: virginia
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      # The reseller talks to the panel admin API. Point this at your panel's
      # admin listener — over the public internet it MUST be HTTPS and the port
      # should be IP-allowlisted to this service (see docs/reseller-panel.md).
      - key: PANEL_ADMIN_URL
        sync: false
      # One dedicated full-privilege panel admin, created on the panel with
      #   node src/admin-cli.js add-admin reseller-svc
      - key: PANEL_ADMIN_USER
        sync: false
      - key: PANEL_ADMIN_PASS
        sync: false
      # Bind on all interfaces so Render's proxy can reach the dashboard.
      - key: CONTROL_HOST
        value: 0.0.0.0
      # Render routes the public URL to $PORT (default 10000), NOT to the
      # reseller's 3330 default — the health check never connects without this.
      - key: CONTROL_PORT
        value: 10000
      # Render's edge proxy is the only client, so throttle on its forwarded IP.
      - key: TRUST_PROXY_HEADER
        value: x-forwarded-for
      # White-label branding (SomaliStream).
      - key: BRAND_NAME
        value: SomaliStream

# NOTE — persistence. The `free` plan has no persistent disks, so /data (the
# credit ledger, principals, cached panel token) is ephemeral and is reset on
# every redeploy. For real use, move to a paid instance type and add:
#
#     disk:
#       name: reseller-data
#       mountPath: /data
#       sizeGB: 1
#
# The free tier is fine for a demo/smoke test of the deploy path.
