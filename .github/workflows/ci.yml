# Test suites on every push to main and every PR. Two lanes:
#   core    — fast + deterministic (loopback/local-testnet only, never the public
#             DHT; ffmpeg installed for test:vod). REQUIRED: keep it green.
#   e2e-dht — end-to-end suites over the real Hyperswarm DHT (+ ffmpeg for the media
#             ones). The public DHT can be flaky from hosted runners, so this job is
#             continue-on-error: it reports signal but can never block a merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes any in-flight run for the same ref (tests are safe to cancel).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Two lockfiles matter to this job: the root one and the phone app's, which
          # test:client installs separately (see that lane). Keying the npm cache on both
          # is what keeps the app's react-native tree cached instead of re-fetched on
          # every run — with only the root lockfile in the key, an unchanged root is an
          # exact hit, and an exact hit never saves, so the app's tarballs never persist.
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install ffmpeg (needed by test:vod)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Crypto unit tests (test:core)
        run: npm run test:core
      # Login-RPC hardening (S42): malformed payloads fail closed instead of crashing
      # the panel, a captured register cannot be replayed, the throttle map stays
      # bounded. Loopback SecretStream pair, no DHT — deterministic.
      - name: Login RPC hardening (test:rpc-hardening)
        run: npm run test:rpc-hardening
      - name: Client store corruption recovery (test:corrupt)
        run: npm run test:corrupt
      - name: ffmpeg argument builders (test:args)
        run: npm run test:args
      # Subprocess probes of every service's fail-fast env validation + the
      # LOG_FORMAT=json structured-logging contract. No network — deterministic.
      - name: Config validation + structured logging (test:config)
        run: npm run test:config
      # The backup/restore drill: a cold copy of the panel DATA_DIR reopens as the
      # same deployment (identity, admins, accounts, catalog). Loopback HTTP only.
      - name: Backup/restore drill (test:backup)
        run: npm run test:backup
      # Key escrow: what leaves the box is ciphertext, the fingerprint names the live
      # panel key, and a wrong passphrase / corrupted file / edited fingerprint are all
      # refused. Also covers the off-by-default gate, re-auth and the rate limit.
      - name: Key escrow drill (test:escrow)
        run: npm run test:escrow
      # Config snapshots + secret-free templates: the redaction engine, the snapshot
      # store, and the /api/config + /api/backups routes on all four services. The
      # load-bearing check seeds REAL secrets (stream keys, SRT passphrase, CENC key,
      # verifiers, credential URLs) and FAILS if any byte of one survives into a
      # downloadable template — this step is what makes a forgotten redaction rule a
      # build failure instead of a leak. bootstrap: [] — never the public DHT.
      - name: Config snapshot redaction scan (test:config-snapshot)
        run: npm run test:config-snapshot
      - name: Config snapshot API, all four services (test:config-api)
        run: npm run test:config-api
      # Loopback UDP + a 1-node local testnet — deterministic, never touches the public
      # DHT. Runners ship the stock net.core.wmem_max, so this also exercises the
      # clamp-detection path against a real undersized kernel ceiling.
      - name: Swarm socket tuning (test:nettune)
        run: npm run test:nettune
      - name: Ephemeral feed buffer / rolling window (test:retention)
        run: npm run test:retention
      # Loopback-only HTTP (in-process panel + local feed server) — deterministic,
      # no DHT, so it belongs in the required lane.
      - name: Remote channel sources (test:sources)
        run: npm run test:sources
      # Channel packages / bouquets (S44): CRUD → sealed-grant materialization,
      # selector resolution, provenance split, pre-S44 migration, autoGrant
      # coexistence. In-process panel + loopback feed server — no DHT.
      - name: Channel packages (test:packages)
        run: npm run test:packages
      # Live entitlement (S57): a viewer with the app OPEN follows their own panel-signed
      # `user/<name>` record without re-logging in — a channel cataloged AND granted
      # mid-session becomes playable (url + headers verbatim), and a revoked redirect
      # channel leaves the lineup without tearing down the play already running. Two of
      # the four cases are the load-bearing ones. A newly granted P2P channel must NOT be
      # admitted, because its key is sealed to an account key the engine no longer holds
      # after login — admitting it would put an unplayable channel in the lineup. And a P2P
      # grant must SURVIVE the panel's ordinary two-put revoke->reconcile: removal is
      # symmetric with admission, and dropping a P2P id on the grant-less intermediate is
      # a ONE-WAY DOOR for that viewer. test:sdk covers the same ground inside its much
      # larger run; this lane exists so the feature stays verifiable on its own. LOCAL DHT
      # testnet, no broadcaster and no ffmpeg, outbound UDP only — deterministic.
      - name: Live entitlement, no re-login (test:live-entitlement)
        timeout-minutes: 10
        run: npm run test:live-entitlement
      # The Aliran MCP server (S46): boots an in-process panel admin server + a
      # broadcaster control server, launches mcp/src/index.js over a stdio pipe and
      # drives it as an MCP client (tools/resources, a write chain, annotations, docs
      # search, re-login-on-401, and the SSH executor against a command stub). No DHT,
      # no ffmpeg, no real sshd — deterministic, so it belongs in the required lane.
      - name: Aliran MCP server (test:mcp)
        run: npm run test:mcp
      # Privacy-preserving analytics (S48): rollup/prune math on a fake clock, the
      # retention=0 kill switch, real loopback logins → aggregate counts, the
      # broadcaster egress/peer sampler, repeater served-bytes metrics, and the
      # NEGATIVE IDENTITY SCAN (no username/key/IP may reach any analytics
      # surface). Loopback SecretStream + HTTP only — no DHT, deterministic.
      - name: Privacy-preserving analytics (test:analytics)
        run: npm run test:analytics
      # Viewer problem reports (S50a): the `report` responder crash-fuzzed (a throwing
      # responder kills the panel), a real login → report → pseudonymous record, the
      # per-reporter throttle, dedupe, ack/resolve + the retention=0 kill switch, a
      # 200-report storm drill (global breaker, storm collapse, ONE alert, a concurrent
      # login stays fast), and the NEGATIVE IDENTITY SCAN (no username or device id may
      # reach any report surface). Loopback SecretStream only — no DHT, deterministic.
      - name: Viewer problem reports (test:reports)
        run: npm run test:reports
      # The whole VOD chain (S8a) on a LOCAL DHT testnet — library ingest → panel vod
      # record class → grant → SDK resolve/serve/seek → delete. Loopback UDP + ffmpeg
      # only, never the public DHT, so it is deterministic enough for the required lane.
      - name: VOD library end-to-end (test:vod)
        timeout-minutes: 10
        run: npm run test:vod
      # The phone/TV app's OWN jest suite (client/__tests__): the screens, hooks and
      # helpers that no lane above ever loads — React Native trees rendered under
      # react-test-renderer, with the worklet driven through its IPC queue rather than
      # mocked. It is the only automated guard on that whole layer, and the two desktop
      # lanes below quietly lean on it: each calls itself the twin of a client/ module
      # running the SAME fixtures "so the two copies cannot drift silently", which only
      # holds while something actually runs the other copy.
      #
      # Three things it needs are NOT in a checkout, which is the whole reason this ran
      # only on developer machines until now:
      #
      #   1. client/ is deliberately NOT an npm workspace — it carries its own
      #      react-native-tvos toolchain (see client/README.md) — so the root `npm ci`
      #      above installs none of it and it needs an install of its own.
      #      --legacy-peer-deps is load-bearing rather than tidiness: react-native there
      #      is an npm ALIAS of react-native-tvos, whose prerelease version satisfies no
      #      strict peer range, so a plain `npm ci` dies with ERESOLVE (the same trap
      #      sdk/react-native/package.json documents). The @aliran/* deps are file: links
      #      resolved through symlinks into i18n/, sdk/ and core/ in this same checkout,
      #      so nothing is published or fetched for them.
      #   2. config/service.json is per-deployment and gitignored. The keyless PUBLIC
      #      descriptor is the only committed one that will load at all — config.ts
      #      refuses service.example.json on purpose, because its panelPubKey is still the
      #      REPLACE_ placeholder, and a real panel key has no business in CI. Suites that
      #      need a baked key mock hasBakedKey() themselves, so keyless costs no coverage.
      #   3. backend/app.bundle.js is bare-pack output, also gitignored, and src/worklet.ts
      #      imports it — without it 13 of the 28 suites cannot even load. Building it here
      #      costs ~7 s and makes a Bare backend that stops bundling a build failure too.
      - name: Install the phone app's dependencies (client/ is not a workspace)
        run: npm ci --prefix client --legacy-peer-deps
      - name: Pick the keyless service descriptor (config/service.json is gitignored)
        run: cp client/config/service.public.json client/config/service.json
      - name: Bundle the Bare worklet backend (src/worklet.ts imports it)
        run: npm --prefix client run bundle-backend
      - name: Phone/TV app jest suite (test:client)
        run: npm run test:client
      # The desktop app's external-VOD provider client (S53c): pure functions, no
      # network and no Electron. It runs the same fixtures as the phone app's jest
      # suite for the twin module, so the two copies cannot drift silently — and it
      # is the only automated guard on the desktop half (the renderer has no jest).
      - name: Desktop external VOD provider (test:desktop-vod)
        run: npm run test:desktop-vod
      # The desktop EPG guide (WS4): the same twin-lane shape as the VOD one above, and the
      # strictest of the family. It asserts desktop/renderer/src/guide.ts is CODE-IDENTICAL
      # to client/src/guide.ts with comments stripped, then re-runs the client's own guide
      # cases verbatim against an esbuild bundle of the DESKTOP copy and renders GuideGrid
      # through react-dom/server. Without it the two copies of the grid math drift and the
      # same schedule quietly draws a different grid on a television and on a desktop —
      # which is precisely the class of bug the mirrored-module pattern trades for.
      - name: Desktop EPG guide, twin of the client copy (test:desktop-guide)
        run: npm run test:desktop-guide
      # Desktop parental controls: the restricted-channel visibility rule and the PIN
      # gate. Same reasoning as the lane above — the phone half has a jest suite, the
      # desktop half had nothing, and this is the only thing standing between a
      # `restricted` channel and a viewer who was never meant to see it.
      - name: Desktop parental controls (test:desktop-parental)
        run: npm run test:desktop-parental
      # Desktop redirect-channel header injection (live-events M3U, Part C): the pure
      # logic behind the main-process webRequest rules — origin-gated Referer/Origin/
      # User-Agent injection, the 127.0.0.1 hard exclusion, and the ACAO patch. No
      # Electron, no network. This is the only automated guard on the forbidden-header
      # injection path that puts a provider identity on the wire, so it must not drift.
      - name: Desktop redirect headers (test:desktop-redirect-headers)
        run: npm run test:desktop-redirect-headers
      # Viewer translation catalogs (S56a): key/placeholder/plural parity across the
      # 14 locales, the report-copy pins against the never-touch label table, and a
      # scan proving no t()/tn() call site names a key that does not exist. Reads
      # files only — no bundler, no app, no network.
      - name: Translation catalogs (test:i18n)
        run: npm run test:i18n
      # Reseller panel: pure logic (roles, credit ledger, store) …
      - name: Reseller panel units (test:reseller-unit)
        run: npm run test:reseller-unit
      # … then the whole hierarchy → credits → activation → lifecycle → outage story
      # against a REAL panel admin server booted in-process. Loopback HTTP only, no
      # DHT at all, so it is fully deterministic — belongs in the required lane.
      - name: Reseller panel end-to-end (test:reseller)
        run: npm run test:reseller

  docker-build:
    name: docker images build (best effort, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Both images build from the repo ROOT context (they vendor the unpublished
      # @aliran/core workspace package via the file:../core dependency).
      - name: Build panel image
        run: docker build -f panel/Dockerfile -t aliran-panel .
      - name: Build broadcaster image
        if: ${{ !cancelled() }}
        run: docker build -f broadcaster/Dockerfile -t aliran-broadcaster .
      - name: Build library image
        if: ${{ !cancelled() }}
        run: docker build -f library/Dockerfile -t aliran-library .
      - name: Build reseller image
        if: ${{ !cancelled() }}
        run: docker build -f reseller/Dockerfile -t aliran-reseller .
      # Prove the images actually run: `init` exercises the whole panel dependency
      # graph (sodium-native, @aliran/core) in a throwaway container, and the
      # broadcaster image must ship ffmpeg with SRT protocol support (needed for
      # authenticated push ingest).
      - name: Smoke panel image (admin-cli init in a throwaway container)
        if: ${{ !cancelled() }}
        run: docker run --rm aliran-panel node src/admin-cli.js init
      - name: Smoke broadcaster image (ffmpeg + libsrt present)
        if: ${{ !cancelled() }}
        run: docker run --rm --entrypoint ffmpeg aliran-broadcaster -hide_banner -protocols | grep -w srt
      # The library needs ffprobe (ingest probe) and its dependency graph must load.
      - name: Smoke library image (ffprobe present + admin CLI runs)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --entrypoint ffprobe aliran-library -version | head -1
          docker run --rm aliran-library node src/library-cli.js list-admins
      # The reseller image needs no ffmpeg; list-principals exercises the whole
      # dependency graph (sodium-native, @aliran/core) against an empty store.
      - name: Smoke reseller image (CLI runs)
        if: ${{ !cancelled() }}
        run: docker run --rm aliran-reseller node src/reseller-cli.js list-principals

  e2e-dht:
    name: e2e over the public DHT (best effort, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install ffmpeg (needed by test:sdk / test:broadcaster-api)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # Each suite retries once (DHT discovery is the flaky part) and is time-capped:
      # a peer that never connects hangs the harness rather than failing it, so the
      # step timeout is the real guard. !cancelled() keeps the remaining suites
      # running after an earlier one fails.
      - name: Sessions + device limits (test:session)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: npm run test:session || npm run test:session
      - name: Broadcaster auto-registration (test:register)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: npm run test:register || npm run test:register
      - name: Assets pipeline (test:assets)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: npm run test:assets || npm run test:assets
      - name: Panel admin API (test:admin-api)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: npm run test:admin-api || npm run test:admin-api
      - name: Player SDK + hybrid CDN↔P2P (test:sdk)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: npm run test:sdk || npm run test:sdk
      - name: Broadcaster control API (test:broadcaster-api)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: npm run test:broadcaster-api || npm run test:broadcaster-api
