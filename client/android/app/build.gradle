apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Per-release version + signing properties (OTA update plumbing). Only active
    // when tools/brand.mjs (or a release operator) passes the -P properties — a
    // plain build keeps the hardcoded defaults and the debug keystore exactly as
    // before. Android installs an update only when it is signed with the same key
    // as the installed build, so shippable / OTA-able releases must pass a real
    // keystore. Operator guide: docs/white-label.md "Shipping to production".
    def aliranVersionCode = project.findProperty('aliranVersionCode')
    if (aliranVersionCode != null && (!aliranVersionCode.toString().isInteger() || aliranVersionCode.toString().toInteger() < 1)) {
        throw new GradleException("-PaliranVersionCode must be a positive integer versionCode (got '${aliranVersionCode}')")
    }
    def aliranStoreFile = project.findProperty('aliranStoreFile')
    if (aliranStoreFile != null && !aliranStoreFile.toString().trim()) {
        // An empty -PaliranStoreFile= must never silently fall back to debug signing.
        throw new GradleException('-PaliranStoreFile is empty — pass the absolute keystore path, or omit the property entirely for a debug-signed build')
    }

    namespace "com.aliranclient"
    defaultConfig {
        applicationId "com.aliranclient"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode(aliranVersionCode != null ? aliranVersionCode.toString().toInteger() : 4)
        versionName(project.findProperty('aliranVersionName') ?: "0.5.0")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release keystore, property-gated like the brand flavor below. Passwords
        // come from the environment only — never from files or -P properties, so
        // they can't leak into brand dirs, shell history helpers, or gradle scans.
        if (aliranStoreFile) {
            def aliranKeyAlias = project.findProperty('aliranKeyAlias')
            def aliranStorePassword = System.getenv('ALIRAN_STORE_PASSWORD')
            def aliranKeyPassword = System.getenv('ALIRAN_KEY_PASSWORD')
            if (!file(aliranStoreFile).isFile()) {
                throw new GradleException("-PaliranStoreFile keystore not found: ${aliranStoreFile}")
            }
            if (!aliranKeyAlias) {
                throw new GradleException('-PaliranStoreFile is set but -PaliranKeyAlias is missing — release signing needs the key alias')
            }
            if (!aliranStorePassword || !aliranKeyPassword) {
                throw new GradleException('-PaliranStoreFile is set but ALIRAN_STORE_PASSWORD / ALIRAN_KEY_PASSWORD are not — release signing takes both passwords from those environment variables')
            }
            brandRelease {
                storeFile file(aliranStoreFile)
                storePassword aliranStorePassword
                keyAlias aliranKeyAlias
                keyPassword aliranKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without -PaliranStoreFile the release keeps the public RN debug
            // keystore: fine for demos, NOT shippable, and OTA updates will not
            // install over a properly-signed build.
            signingConfig(aliranStoreFile ? signingConfigs.brandRelease : signingConfigs.debug)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // 32-BIT: TWO HOLEPUNCH ADDONS ARE BROKEN ON A 32-BIT ABI, SO DO NOT SHIP THEM THERE.
    // Measured on a TCL Android 14 set-top box (armeabi-v7a only, and that hardware is
    // common). Without this the P2P engine is DEAD on every 32-bit device: the app starts,
    // draws its login screen, and sits on "Connecting…" for ever.
    //
    //   fs-native-extensions 1.5.0  src/linux.c does fcntl(fd, F_OFD_SETLK, &struct flock)
    //     and the package defines _FILE_OFFSET_BITS=64 NOWHERE. Open-file-description locks
    //     need struct flock64 on a 32-bit ABI, so the kernel answers EINVAL, and index.js
    //     rethrows everything that is not EAGAIN — killing the worklet at corestore's first
    //     storage open.
    //   crc-native 1.1.8            SIGBUS/BUS_ADRALN a moment later: a 32-bit load from an
    //     address that is not 4-byte aligned (observed fault address ended in 3). arm64 and
    //     x86_64 absorb the misalignment; armv7 faults.
    //
    // DROPPING THEM IS A SUPPORTED PATH, NOT A HACK. Each has exactly ONE consumer and each
    // consumer already handles the addon being absent, because both are optional by design:
    //   random-access-file/index.js  `try { fsext = require(...) } catch {}`, then guards
    //                                every use — lock, sparse and trim are simply skipped.
    //   crc-universal/index.js       falls back to its own JS crc32 implementation.
    // So a 32-bit build loses file locking and block reclaim, gets a slower CRC, and runs.
    // Both are the right trade against an engine that does not start at all.
    //
    // BUT THE SKIPPED trim IS NOT FREE — IT IS HOW hypercore's clear() ACTUALLY FREES DISK.
    // random-access-file `_del()` answers `req.callback(null)` when fsext is missing: a
    // SILENT SUCCESS THAT FREES ZERO BYTES. So on armeabi-v7a and x86 every reclaim pass
    // reports done while the file keeps every block, and the active live replica grows for
    // the WHOLE watch session (~0.9 GB/hour at 2 Mbit/s) on hardware that often has 2-4 GB
    // of free flash. Viewer disk on these two ABIs is therefore bounded NOT by clear() but
    // by the byte-budgeted replica ROTATION in sdk/serve.js + sdk/player.js: the SDK reads
    // each replica's real allocated size and, past `reclaimBudgetBytes` (default 512 MiB),
    // purges the feed and reopens it — unlink is the one reclaim that needs no hole
    // punching.
    // (`sparse` costs nothing here: fs-native-extensions short-circuits it off Windows
    // anyway, so what these two ABIs really give up is `lock` and `trim`.)
    //
    // DO NOT ARGUE "INERT ON 64-BIT" FROM THE 512 MiB NUMBER. An earlier version of this
    // comment ended "A 64-bit build never reaches that budget, so it never rotates". That
    // claim is RETIRED in sdk/serve.js (the DEFAULTS note) and must not come back here. The
    // budget is a flat number; the live window it is compared against is OPERATOR-SETTABLE up
    // to 64 x 30 s = 1920 s, where ONE healthy window at 2 Mbit/s is 458 MiB — 90% of the
    // budget — and any channel over ~2.24 Mbit/s is over it OUTRIGHT, on an arm64 phone with
    // nothing wrong with it. Two MEASURED mechanisms are what actually keep a 64-bit build
    // from rotating, and neither is this number:
    //   probeHolePunch    writes a scratch file, punches its middle and re-measures the
    //                     allocated size. Where the punch FREES BYTES, Reclaim._budgetOff
    //                     latches and the BLOB budget is dead for the life of the handler —
    //                     no measurement, no callback, no rotation ON THAT BOUND.
    //   _effectiveBudget  the ceiling actually applied is max(reclaimBudgetBytes, 3 x the
    //                     OBSERVED live window), so a replica holding ~one window is under
    //                     budget BY CONSTRUCTION at any hls_time x hls_list_size and any
    //                     bitrate — on BOTH sides of the probe.
    // So the honest statement is about CAPABILITY, not word size: a store whose filesystem
    // can punch holes does not rotate ON THE BLOB BOUND. A 64-bit build on exFAT, FAT32 or a
    // network mount DOES arm the budget, and correctly — the punch REJECTS there
    // (EOPNOTSUPP/ENOTSUP) rather than lying about success the way the missing addon does
    // above.
    //
    // ⚠ AND DO NOT READ THE LINE ABOVE AS "A PUNCH-CAPABLE DEVICE NEVER ROTATES". That was
    // true when this comment was written and is not any more. A punch frees BLOB blocks and
    // can never free the Hyperbee metadata core, which grows for as long as a live feed is
    // followed, so sdk/serve.js carries a second, punch-INDEPENDENT ceiling on the metadata
    // alone (metaBudgetBytes, 64 MiB) that rotates exactly the device this probe switches the
    // blob budget off on. Roughly one rotation per day of continuous same-channel watching;
    // the feed:rotate event names which bound asked (trigger: 'budget' | 'meta').
    //
    // 64-bit builds are UNTOUCHED and keep both addons — this is scoped to the two 32-bit
    // ABIs on purpose, so the common case pays nothing.
    //
    // REMOVE THIS once Holepunch ships prebuilds with the fixes (a one-line
    // _FILE_OFFSET_BITS=64 for the first; an alignment-safe read for the second). Both were
    // reported upstream at the latest published versions — there is no version to bump to.
    packaging {
        jniLibs {
            excludes += [
                '**/armeabi-v7a/libfs-native-extensions*.so',
                '**/armeabi-v7a/libcrc-native*.so',
                '**/x86/libfs-native-extensions*.so',
                '**/x86/libcrc-native*.so'
            ]
        }
    }

    // White-label brand flavor (S19). Only declared when tools/brand.mjs passes
    // -PaliranBrandId / -PaliranBrandRes — a plain build never sees a flavor, so the
    // default dev/release builds (tasks, appId, resources) stay exactly as above.
    // The brand's applicationId suffix makes branded APKs co-installable; the res
    // overlay dir (generated by brand.mjs under build/aliranBrand/) supplies
    // app_name, adaptive launcher icon, splash logo, wallpaper, and TV banner.
    def aliranBrandId = project.findProperty('aliranBrandId')
    if (aliranBrandId) {
        flavorDimensions.add('brand')
        productFlavors {
            create(aliranBrandId) {
                dimension 'brand'
                applicationId "com.aliranclient.${aliranBrandId}"
            }
        }
        sourceSets.maybeCreate(aliranBrandId).res.srcDirs = [file(project.property('aliranBrandRes'))]
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Google Cast ("Play on a TV", phone). react-native-google-cast autolinks and pulls
    // the framework in, but only as an `implementation` dependency — which is NOT on this
    // module's compile classpath. The app compiles two things against it itself
    // (CastOptionsProvider, and the warm-up call in MainActivity), so the coordinate is
    // declared here rather than inherited by luck.
    //
    // The version comes from the SAME ext the library reads (android/build.gradle
    // castFrameworkVersion), so the two cannot resolve to different Cast SDKs.
    //
    // NOT A TV DEPENDENCY, but it ships in the one APK: this is a single-APK build for
    // phone AND Android TV, and there is no flavor to split it into. It is classes a
    // television never loads — nothing on TV calls into the framework (see
    // MainActivity.warmCastFramework and client/src/cast.ts).
    implementation("com.google.android.gms:play-services-cast-framework:${rootProject.ext.castFrameworkVersion}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
